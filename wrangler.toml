# wrangler.toml

name = "gaming-website-2"
main = "workers-ssr/entry.mjs"
compatibility_date = "2025-01-01"

[site]
bucket = "./public"

[dev]
ip = "127.0.0.1"
port = 3000
local_protocol = "http"
upstream = "http://localhost:3000"

# Active les fonctionnalités nécessaires
compatibility_flags = [
  "nodejs_compat"
]